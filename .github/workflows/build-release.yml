name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build the app
        run: npm run build

      - name: Extract version from package.json
        id: version
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*.exe
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            # DeepSeek QuickTab v${{ steps.version.outputs.VERSION }}
            
            ## Changes
            - Added first-time license pop-up showing GPL-3.0 license information
            - Users can now view the full license from the context menu
            - License acknowledgment is stored to prevent repeated pop-ups
            
            ## Installation
            Download the `.exe` installer below and run it to install or update DeepSeek QuickTab.
            
            ## Features
            - Quick taskbar launcher for DeepSeek Chat
            - Lightweight popup window
            - Auto-start on login (optional)
            - GPL-3.0 Licensed
            
            For more information, visit the [repository](https://github.com/Jake-makes/deepseek-quicktab).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deepseek-quicktab-${{ steps.version.outputs.VERSION }}
          path: dist/**/*.exe
          retention-days: 30
